<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idiom Rooms</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <main id="stage" aria-label="Game room">
      <div id="void" aria-hidden="true"></div>
      <div id="cold-vignette" aria-hidden="true"></div>
      <div id="floor" aria-hidden="true"></div>
      <div id="player" aria-hidden="true"></div>
      <div id="click-pulse" aria-hidden="true"></div>
    </main>

    <div id="end-screen" class="hidden" role="dialog" aria-modal="true" aria-label="Complete">
      <div class="end-bloom" aria-hidden="true"></div>
      <button id="replay-btn" type="button" aria-label="Replay"></button>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
